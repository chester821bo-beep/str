name: ladron

on:
  workflow_dispatch: # Se activa de forma manual con el botón de PLAY en la web de GitHub

permissions:
  contents: write
  actions: write

jobs:
  descarga_bunker:
    runs-on: ubuntu-24.04
    steps:
      - name: 🗄️ Inicializando espacio en el disco virtual de Microsoft
        uses: actions/checkout@v4

      - name: 🛠️ Instalar FFmpeg y herramientas de forma interna y nativa
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg curl jq bc

      - name: 🚀 Extracción en Cadena Directa e Inmune a Bloqueos de Tamaño
        run: |
          # 🪓 [REACTOR CENTRAL INDUSTRIAL v7.7 - DIRECT INJECTION CORE]
          export TERM=xterm
          export GH_TOKEN=${{ secrets.GITHUB_TOKEN }}
          
          MI_TOKEN_STREAMING="${{ secrets.TOKEN_B }}"
          
          echo "📡 [STREAMDROME] SUCCIONANDO ÓRDENES DE TRABAJO DESDE EL GIST..."
          
          curl -s "https://gist.githubusercontent.com/chester821bo-beep/8737835852d8c34e1db318a52aa0073a/raw/1408.txt" | tr -d '\r' | sed '/^$/d' > ordenes_bunker.txt
         
          if [ -z "$MI_TOKEN_STREAMING" ]; then
            echo "❌ ERROR: No has creado el secreto 'TOKEN_B' en los ajustes de GitHub."
            exit 1
          fi

          # 🎯 ELIMINADO EL RUIDO: Ya no intentamos crear nada. Pasamos directo a procesar los videos.
          echo "📦 Conectando directamente con el cofre existente 'bunker_mutiny'..."

          contador=1
          
          while read -r linea <&3 || [ -n "$linea" ]; do
            URL_PIRATA=$(echo "$linea" | awk -F'|' '{print $1}' | tr -d ' ')
            NOMBRE_FINAL=$(echo "$linea" | awk -F'|' '{print $2}' | tr -d ' ')
            
            if [ -n "$URL_PIRATA" ] && [ -n "$NOMBRE_FINAL" ]; then
              echo "------------------------------------------------------------"
              echo "🍿 [PROCESANDO TRABAJO N° $contador]: $NOMBRE_FINAL"
              echo "------------------------------------------------------------"
              
              ARCHIVO_TMP="temp_proceso.mp4"
              BASE_NOMBRE=$(basename "$NOMBRE_FINAL" .mp4)
              
              # 🕵️‍♂️ IDENTIDAD HISTÓRICA: El agente exacto de tu script original
              USER_AGENT_VLC="VLC/3.0.18 LibVLC/3.0.18"
              
              echo "📥 FASE 1: Abriendo flujo de red clonando los parámetros de VLC..."
              
              # 🔥 REPARACIÓN TOTAL DE RED: Corrección en la fusión de cabeceras de Linux.
              # Ahora el token y el User-Agent se envían de forma idéntica a como le gusta al servidor.
              ffmpeg -y -nostdin \
                -reconnect 1 -reconnect_at_eof 1 -reconnect_streamed 1 -reconnect_delay_max 10 \
                -headers "Authorization: token ${MI_TOKEN_STREAMING}"$'\r\n'"User-Agent: ${USER_AGENT_VLC}"$'\r\n' \
                -i "$URL_PIRATA" \
                -filter_complex "[0:v]scale=1280:720:force_original_aspect_ratio=decrease,pad=1280:720:(ow-iw)/2:(oh-ih)/2,setsar=1:1[v_moldeado]" \
                -map "[v_moldeado]" -map 0:a:0? -r 30 -pix_fmt yuv420p \
                -c:v libx264 -preset superfast -crf 23 -g 60 -keyint_min 60 \
                -c:a aac -b:a 128k -ac 2 -ar 44100 -async 1 "$ARCHIVO_TMP"
                
              if [ ! -s "$ARCHIVO_TMP" ]; then
                echo "❌ ERROR: El servidor cerró el grifo o el video no generó datos."
                rm -f "$ARCHIVO_TMP"
                contador=$((contador + 1))
                continue
              fi
                
              PESO_BYTES=$(stat -c%s "$ARCHIVO_TMP")
              LIMITE_BYTES=1500000000 
              
              if [ "$PESO_BYTES" -gt "$LIMITE_BYTES" ]; then
                echo "⚠️ EL ARCHIVO EXCEDE EL GIGA Y MEDIO. Activando serrucho..."
                DURACION_TOTAL=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "$ARCHIVO_TMP")
                MITAD_TIEMPO=$(echo "$DURACION_TOTAL / 2" | bc -l)
                
                ffmpeg -y -i "$ARCHIVO_TMP" -t "$MITAD_TIEMPO" -c copy -map 0 "$NOMBRE_FINAL"
                ffmpeg -y -ss "$MITAD_TIEMPO" -i "$ARCHIVO_TMP" -c copy -map 0 "${BASE_NOMBRE}_2.mp4"
                
                echo "💾 Guardando fragmentos en la release..."
                gh release upload bunker_mutiny "$NOMBRE_FINAL" --clobber || echo "❌ Falló la subida parte 1."
                gh release upload bunker_mutiny "${BASE_NOMBRE}_2.mp4" --clobber || echo "❌ Falló la subida parte 2."
                rm -f "$NOMBRE_FINAL" "${BASE_NOMBRE}_2.mp4"
              else
                echo "💾 Guardando video completo en la release..."
                mv "$ARCHIVO_TMP" "$NOMBRE_FINAL"
                gh release upload bunker_mutiny "$NOMBRE_FINAL" --clobber || echo "❌ Falló la subida del video."
                rm -f "$NOMBRE_FINAL"
              fi
              
              rm -f "$ARCHIVO_TMP"
              echo "✅ TRABAJO N° $contador FINALIZADO CON ÉXITO."
              sleep 15
              contador=$((contador + 1))
            fi
          done 3< ordenes_bunker.txt

        
